[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/apache.out.log
stderr_logfile=/var/log/supervisor/apache.err.log

; Tareas programadas de Laravel (routes/console.php). Corre como programa de
; supervisor y no por cron porque cron no hereda las variables de entorno del
; contenedor, que es de donde sale la configuración en Render.
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scheduler.out.log
stderr_logfile=/var/log/supervisor/scheduler.err.log

[program:queue-worker]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/var/log/supervisor/queue.out.log
stderr_logfile=/var/log/supervisor/queue.err.log
